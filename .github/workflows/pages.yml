name: Publikacja na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Przygotuj katalog publish
        run: |
          rm -rf publish && mkdir -p publish
          if [ -d randkuj-normalnie-site ]; then
            cp -R randkuj-normalnie-site/. publish/
          else
            mkdir -p deploy && unzip -o randkuj-normalnie-landing.zip -d deploy
            cp -R deploy/randkuj-normalnie-site/. publish/
          fi
          python3 scripts/enhance_site.py
          touch publish/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish
      - id: deployment
        uses: actions/deploy-pages@v4
